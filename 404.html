<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>404 — Omega Gradient</title>
<link rel="icon" href="/omega-gradient-logo.png" type="image/png" sizes="400x400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#000; --panel:#0b0a08; --line:rgba(199,192,153,0.16); --gold:#c7c099; --gold-bright:#e8dfb8; --green:#93ffba; --teal:#55f0d5; --amber:#ffc857; --text:#f5f4f0; --muted:#8a8779; }
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text); min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  font-family:"Space Grotesk",sans-serif;
  background-image:linear-gradient(to right, rgba(199,192,153,0.04) 1px, transparent 1px),linear-gradient(to bottom, rgba(199,192,153,0.04) 1px, transparent 1px);
  background-size:80px 80px;
}
.card { text-align:center; padding:56px 40px; background:var(--panel); border:1px solid var(--line); max-width:520px; margin:20px; position:relative; }
.card::before, .card::after { content:""; position:absolute; width:8px; height:8px; border:1px solid rgba(199,192,153,0.35); }
.card::before { top:-1px; left:-1px; border-right:none; border-bottom:none; }
.card::after { bottom:-1px; right:-1px; border-left:none; border-top:none; }
.card img { width:56px; height:56px; margin-bottom:18px; }
.code { font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:0.22em; color:var(--muted); text-transform:uppercase; }
h1 { font-size:30px; margin:10px 0 8px; background:linear-gradient(90deg,var(--green),var(--teal),var(--amber)); -webkit-background-clip:text; background-clip:text; color:transparent; }
p { color:var(--muted); font-size:14px; line-height:1.6; }
nav { margin-top:26px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
nav a { font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); text-decoration:none; border:1px solid rgba(199,192,153,0.35); padding:8px 14px; }
nav a:hover { color:var(--gold-bright); border-color:var(--gold-bright); }
</style>
</head>
<body>
<main class="card">
  <img src="/omega-gradient-logo.png" alt="Omega Gradient">
  <div class="code">404 · Signal not found</div>
  <h1>This page is off the grid</h1>
  <p>The address you requested does not exist on omegagradient.com. The live GPU market data is still running below.</p>
  <nav>
    <a href="/">Home</a>
    <a href="/compute.html">Marketplace</a>
    <a href="/gpus/">GPU Price Index</a>
  </nav>
</main>
</body>
</html>
